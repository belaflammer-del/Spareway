# XcodeGen-Spezifikation: erzeugt DealNivo.xcodeproj (lokal auf dem Mac oder in der Cloud via Codemagic).
#   brew install xcodegen && xcodegen generate
name: DealNivo
options:
  bundleIdPrefix: de.dealnivo
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    VERSIONING_SYSTEM: apple-generic
targets:
  DealNivo:
    type: application
    platform: iOS
    sources:
      - path: DealNivo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.dealnivo.app
        PRODUCT_NAME: DealNivo
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: DealNivo/Info.plist
      properties:
        CFBundleDisplayName: DEAL-NIVO
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: DEAL-NIVO nutzt die Kamera, damit du Fotos oder Screenshots einer Anzeige zur Prüfung hochladen kannst.
        NSPhotoLibraryUsageDescription: DEAL-NIVO greift nur auf Bilder zu, die du selbst zur Prüfung auswählst.
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIUserInterfaceStyle: Dark
        CFBundleURLTypes:
          - CFBundleURLName: de.dealnivo.app
            CFBundleURLSchemes: [dealnivo]
    entitlements:
      path: DealNivo/DealNivo.entitlements
      properties:
        com.apple.security.application-groups: [group.de.dealnivo.app]
    dependencies:
      - target: ShareExtension
        embed: true
  ShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: ShareExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.dealnivo.app.share
        PRODUCT_NAME: ShareExtension
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: DEAL-NIVO
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsImageWithMaxCount: 8
    entitlements:
      path: ShareExtension/ShareExtension.entitlements
      properties:
        com.apple.security.application-groups: [group.de.dealnivo.app]
