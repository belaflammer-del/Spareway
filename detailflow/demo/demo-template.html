<title>DetailFlow Demo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: feste Seitenleiste (Desktop) / untere Navigation (Handy), Inhalt in Karten – wie die echte App */
:root {
  --bg: #fafafa; --fg: #18181b; --card: #ffffff; --muted: #f4f4f5; --muted-fg: #71717a; --border: #e4e4e7;
  --accent: #0f766e; --accent-fg: #ffffff; --accent-soft: #ccfbf1; --danger: #dc2626;
  --blue-bg: #eff6ff; --blue-fg: #1d4ed8; --green-bg: #ecfdf5; --green-fg: #047857; --amber-bg: #fffbeb; --amber-fg: #b45309;
  --red-bg: #fef2f2; --red-fg: #b91c1c; --violet-bg: #f5f3ff; --violet-fg: #6d28d9;
  --doc-bg: #ffffff; --doc-fg: #18181b; --doc-muted: #71717a; --doc-line: #e4e4e7;
  --ev-a: #14b8a6; --ev-a-bg: #ccfbf1; --ev-a-fg: #042f2e; --ev-b: #38bdf8; --ev-b-bg: #e0f2fe; --ev-b-fg: #082f49; --ev-c: #f59e0b; --ev-c-bg: #fef3c7; --ev-c-fg: #451a03;
  --font: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0b0b0d; --fg: #f4f4f5; --card: #141417; --muted: #1c1c20; --muted-fg: #a1a1aa; --border: #27272a;
  --accent: #2dd4bf; --accent-fg: #042f2e; --accent-soft: #134e4a; --danger: #f87171;
  --blue-bg: #172554; --blue-fg: #93c5fd; --green-bg: #052e24; --green-fg: #6ee7b7; --amber-bg: #3b2506; --amber-fg: #fcd34d;
  --red-bg: #3f1111; --red-fg: #fca5a5; --violet-bg: #2e1065; --violet-fg: #c4b5fd; --ev-a: #14b8a6; --ev-a-bg: #042f2e; --ev-a-fg: #ccfbf1; --ev-b: #0ea5e9; --ev-b-bg: #082f49; --ev-b-fg: #e0f2fe; --ev-c: #f59e0b; --ev-c-bg: #451a03; --ev-c-fg: #fef3c7; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0b0b0d; --fg: #f4f4f5; --card: #141417; --muted: #1c1c20; --muted-fg: #a1a1aa; --border: #27272a;
  --accent: #2dd4bf; --accent-fg: #042f2e; --accent-soft: #134e4a; --danger: #f87171;
  --blue-bg: #172554; --blue-fg: #93c5fd; --green-bg: #052e24; --green-fg: #6ee7b7; --amber-bg: #3b2506; --amber-fg: #fcd34d;
  --red-bg: #3f1111; --red-fg: #fca5a5; --violet-bg: #2e1065; --violet-fg: #c4b5fd; --ev-a: #14b8a6; --ev-a-bg: #042f2e; --ev-a-fg: #ccfbf1; --ev-b: #0ea5e9; --ev-b-bg: #082f49; --ev-b-fg: #e0f2fe; --ev-c: #f59e0b; --ev-c-bg: #451a03; --ev-c-fg: #fef3c7; color-scheme: dark }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 14px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: inherit; text-decoration: none; }
.tnum { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted-fg); }
.small { font-size: 12px; }

/* Shell */
.side { position: fixed; inset: 0 auto 0 0; width: 232px; background: var(--card); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding-left: env(safe-area-inset-left, 0px); z-index: 20; }
.logo { display: flex; align-items: center; gap: 8px; font-weight: 600; letter-spacing: -0.01em; }
.logo i { width: 28px; height: 28px; border-radius: 8px; background: var(--fg); color: var(--bg); display: grid; place-items: center; }
.side .head { padding: 16px; }
.side .company { padding: 0 16px 12px; font-size: 12px; font-weight: 500; color: var(--muted-fg); }
.nav { flex: 1; padding: 0 8px; display: flex; flex-direction: column; gap: 2px; }
.nav a { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 8px; color: var(--muted-fg); }
.nav a:hover { background: var(--muted); color: var(--fg); }
.nav a.on { background: var(--muted); color: var(--fg); font-weight: 500; }
.nav svg, .bnav svg, .side .foot svg { width: 17px; height: 17px; flex-shrink: 0; }
.side .foot { border-top: 1px solid var(--border); padding: 8px; display: flex; flex-direction: column; gap: 2px; }
.side .foot button { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border: 0; background: none; border-radius: 8px; color: var(--muted-fg); cursor: pointer; text-align: left; }
.side .foot button:hover { background: var(--muted); color: var(--fg); }
.mtop { display: none; }
.bnav { display: none; }
main { padding-left: 232px; }
.wrap { max-width: 1120px; margin: 0 auto; padding-block: 28px 48px; padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); }
.demo-bar { background: var(--accent-soft); color: var(--fg); font-size: 12px; padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.demo-bar button { border: 0; background: none; text-decoration: underline; cursor: pointer; font-size: 12px; padding: 0; }

@media (max-width: 1023px) {
  .side { display: none; }
  .side.open { display: flex; width: 280px; box-shadow: 0 10px 40px rgba(0,0,0,.25); }
  .scrim { position: fixed; inset: 0; background: rgba(0,0,0,.3); z-index: 15; }
  main { padding-left: 0; padding-bottom: calc(64px + env(safe-area-inset-bottom, 0px)); }
  .mtop { display: flex; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; height: 54px; align-items: center; justify-content: space-between; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); background: var(--bg); border-bottom: 1px solid var(--border); }
  .mtop button { border: 0; background: none; padding: 6px; cursor: pointer; }
  .bnav { display: grid; grid-template-columns: repeat(4, 1fr); position: fixed; inset: auto 0 0 0; z-index: 10; background: var(--card); border-top: 1px solid var(--border); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
  .bnav a { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 0; font-size: 11px; color: var(--muted-fg); }
  .bnav a.on { color: var(--fg); }
  .wrap { padding-block: 20px 32px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }

/* Bausteine */
.ph { display: flex; flex-wrap: wrap; gap: 12px 16px; align-items: flex-end; justify-content: space-between; margin-bottom: 20px; }
.ph h1 { margin: 0; font-size: 24px; font-weight: 600; letter-spacing: -0.02em; text-wrap: balance; }
.ph p { margin: 4px 0 0; color: var(--muted-fg); }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; box-shadow: 0 1px 2px rgba(0,0,0,.04); min-width: 0; }
.ch { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; padding: 14px 20px; border-bottom: 1px solid var(--border); }
.ch h2 { margin: 0; font-size: 15px; font-weight: 600; }
.ch p { margin: 2px 0 0; font-size: 13px; color: var(--muted-fg); }
.pad { padding: 20px; }
.list > * { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 20px; border-top: 1px solid var(--border); min-width: 0; }
.list > *:first-child { border-top: 0; }
.list > a:hover, .list > button:hover { background: var(--muted); }
.list > button { width: 100%; border-left: 0; border-right: 0; border-bottom: 0; background: none; text-align: left; cursor: pointer; }
.t { min-width: 0; }
.t b { display: block; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.t span { display: block; font-size: 12px; color: var(--muted-fg); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.empty { padding: 24px 20px; color: var(--muted-fg); font-size: 13px; }
.grid2 { display: grid; grid-template-columns: minmax(0,1fr); gap: 20px; }
.grid4 { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 10px; }
@media (min-width: 1024px) { .grid2 { grid-template-columns: repeat(2, minmax(0,1fr)); } .grid4 { grid-template-columns: repeat(4, minmax(0,1fr)); } .side-layout { grid-template-columns: minmax(0,1fr) 360px !important; } }
.side-layout { display: grid; grid-template-columns: minmax(0,1fr); gap: 20px; align-items: start; }
.stat { padding: 16px; }
.stat p { margin: 0; font-size: 12px; color: var(--muted-fg); font-weight: 500; }
.stat strong { display: block; margin-top: 4px; font-size: 24px; font-weight: 600; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 40px; padding: 0 16px; border-radius: 10px; border: 1px solid transparent; background: var(--fg); color: var(--bg); font-weight: 500; cursor: pointer; white-space: nowrap; transition: transform .1s, opacity .15s; }
.btn:active { transform: scale(.98); }
.btn:hover { opacity: .9; }
.btn.sec { background: var(--card); color: var(--fg); border-color: var(--border); box-shadow: 0 1px 2px rgba(0,0,0,.04); }
.btn.sec:hover { background: var(--muted); opacity: 1; }
.btn.ghost { background: none; color: var(--fg); }
.btn.ghost:hover { background: var(--muted); }
.btn.sm { height: 32px; padding: 0 12px; font-size: 13px; }
.btn.block { width: 100%; }
.btn:focus-visible, .nav a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, .pick:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn svg { width: 16px; height: 16px; }
.quick { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 8px; margin-bottom: 20px; }
@media (min-width: 640px) { .quick { grid-template-columns: repeat(4, minmax(0,1fr)); } }
.quick .btn { height: 48px; justify-content: flex-start; padding: 0 14px; }
.quick .btn span { overflow: hidden; text-overflow: ellipsis; }
.badge { display: inline-flex; align-items: center; border-radius: 999px; padding: 2px 8px; font-size: 12px; font-weight: 500; white-space: nowrap; background: var(--muted); color: var(--muted-fg); }
.b-blue { background: var(--blue-bg); color: var(--blue-fg); } .b-green { background: var(--green-bg); color: var(--green-fg); }
.b-amber { background: var(--amber-bg); color: var(--amber-fg); } .b-red { background: var(--red-bg); color: var(--red-fg); }
.b-violet { background: var(--violet-bg); color: var(--violet-fg); } .b-teal { background: var(--accent-soft); color: var(--accent); }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field label { font-size: 13px; font-weight: 500; }
.field .hint { font-size: 12px; color: var(--muted-fg); }
.inp { width: 100%; height: 40px; border-radius: 10px; border: 1px solid var(--border); background: var(--card); padding: 0 12px; }
textarea.inp { height: auto; min-height: 72px; padding: 8px 12px; }
.inp:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent); }
.fgrid { display: grid; grid-template-columns: minmax(0,1fr); gap: 14px; }
@media (min-width: 640px) { .fgrid { grid-template-columns: repeat(2, minmax(0,1fr)); } .fgrid .full { grid-column: 1 / -1; } }
.seg { display: inline-grid; grid-auto-flow: column; gap: 4px; background: var(--muted); padding: 4px; border-radius: 10px; }
.seg button { border: 0; background: none; padding: 6px 12px; border-radius: 7px; color: var(--muted-fg); cursor: pointer; }
.seg button.on { background: var(--card); color: var(--fg); font-weight: 500; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.seg.full { display: grid; grid-template-columns: repeat(4, 1fr); grid-auto-flow: row; }
.step h2 { display: flex; align-items: center; gap: 8px; margin: 0 0 14px; font-size: 15px; }
.step h2 i { font-style: normal; width: 22px; height: 22px; border-radius: 50%; background: var(--fg); color: var(--bg); display: grid; place-items: center; font-size: 12px; }
.steps { display: flex; flex-direction: column; gap: 16px; }
.picks { display: grid; grid-template-columns: minmax(0,1fr); gap: 8px; }
@media (min-width: 640px) { .picks { grid-template-columns: repeat(2, minmax(0,1fr)); } }
.pick { border: 1px solid var(--border); background: var(--card); border-radius: 12px; padding: 10px 12px; text-align: left; cursor: pointer; }
.pick:hover { border-color: color-mix(in srgb, var(--fg) 25%, transparent); }
.pick.on { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); background: color-mix(in srgb, var(--accent-soft) 45%, var(--card)); }
.pick b { display: block; font-weight: 500; }
.pick span { font-size: 12px; color: var(--muted-fg); }
.acc { border: 1px solid var(--border); border-radius: 12px; }
.acc + .acc { margin-top: 8px; }
.acc > button { width: 100%; display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; border: 0; background: none; cursor: pointer; font-weight: 500; }
.acc .body { border-top: 1px solid var(--border); padding: 6px; display: grid; grid-template-columns: minmax(0,1fr); }
@media (min-width: 640px) { .acc .body { grid-template-columns: repeat(2, minmax(0,1fr)); } }
.chk { display: flex; justify-content: space-between; gap: 8px; align-items: center; padding: 6px 8px; border-radius: 8px; cursor: pointer; font-size: 13px; }
.chk:hover { background: var(--muted); }
.chk.dis { opacity: .5; cursor: default; }
.chk span:first-child { display: flex; gap: 8px; align-items: center; min-width: 0; }
.count { background: var(--fg); color: var(--bg); border-radius: 999px; padding: 0 7px; font-size: 11px; }
.sum { position: sticky; top: calc(16px + env(safe-area-inset-top, 0px)); overflow: hidden; }
@media (max-width: 1023px) { .sum { top: calc(70px + env(safe-area-inset-top, 0px)); } }
.sum ul { list-style: none; margin: 0; padding: 0; max-height: 300px; overflow-y: auto; }
.sum li { padding: 9px 20px; border-top: 1px solid var(--border); font-size: 13px; }
.sum li:first-child { border-top: 0; }
.kv { display: flex; justify-content: space-between; gap: 12px; }
.tot { padding: 14px 20px; border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 5px; }
.tot .big { font-size: 16px; font-weight: 600; border-top: 1px solid var(--border); padding-top: 8px; margin-top: 2px; }
.intern { background: var(--muted); padding: 12px 20px; border-top: 1px solid var(--border); font-size: 12px; color: var(--muted-fg); display: flex; flex-direction: column; gap: 3px; }
.warn { padding: 10px 20px; border-top: 1px solid var(--border); font-size: 12px; color: var(--amber-fg); display: flex; flex-direction: column; gap: 4px; }
.week { display: grid; grid-template-columns: repeat(7, minmax(0,1fr)); text-align: center; }
.week > div { padding: 12px 2px; border-left: 1px solid var(--border); }
.week > div:first-child { border-left: 0; background: var(--muted); border-bottom-left-radius: 16px; }
.week small { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted-fg); }
.week b { display: block; font-weight: 500; }
.week em { display: block; font-style: normal; font-size: 12px; margin-top: 2px; color: var(--muted-fg); }
.week em.has { color: var(--accent); font-weight: 500; }
.board { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 12px; }
.col { width: 250px; flex-shrink: 0; }
.col header { display: flex; justify-content: space-between; padding: 0 4px 8px; font-weight: 500; }
.col .lane { background: var(--muted); border-radius: 14px; padding: 8px; min-height: 90px; display: flex; flex-direction: column; gap: 8px; }
.kcard { display: block; background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 12px; }
.kcard:hover { border-color: color-mix(in srgb, var(--fg) 25%, transparent); }
.kcard b { display: block; font-weight: 500; font-size: 13px; }
.kcard p { margin: 4px 0 0; font-size: 12px; }
.kcard .kv { margin-top: 8px; font-size: 12px; color: var(--muted-fg); }
.search { position: relative; margin-bottom: 14px; }
.search .inp { padding-left: 36px; }
.search svg { position: absolute; left: 12px; top: 12px; width: 16px; height: 16px; color: var(--muted-fg); }
.notice { border-radius: 12px; padding: 10px 14px; font-size: 13px; background: var(--blue-bg); color: var(--blue-fg); margin-bottom: 16px; }
.notice.amber { background: var(--amber-bg); color: var(--amber-fg); }
.notice.green { background: var(--green-bg); color: var(--green-fg); }
.price-in { width: 96px; height: 32px; text-align: right; border-radius: 8px; border: 1px solid var(--border); background: var(--card); padding: 0 8px; }
.svc-row { display: flex; gap: 12px; align-items: center; justify-content: space-between; padding: 8px 20px; border-top: 1px solid var(--border); }
.svc-row.off { opacity: .45; }
.toggle { width: 38px; height: 22px; border-radius: 999px; border: 0; background: var(--border); position: relative; cursor: pointer; flex-shrink: 0; }
.toggle::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: var(--card); transition: left .15s; box-shadow: 0 1px 2px rgba(0,0,0,.2); }
.toggle.on { background: var(--accent); }
.toggle.on::after { left: 19px; }
.items-check button { display: flex; gap: 12px; align-items: center; width: 100%; padding: 12px 20px; border: 0; border-top: 1px solid var(--border); background: none; cursor: pointer; text-align: left; }
.items-check button:first-child { border-top: 0; }
.items-check button:hover { background: var(--muted); }
.dot { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--muted-fg); flex-shrink: 0; display: grid; place-items: center; }
.dot.done { border-color: var(--accent); background: var(--accent); color: var(--accent-fg); }
.done-t { text-decoration: line-through; color: var(--muted-fg); }
.modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 40; display: flex; align-items: flex-end; justify-content: center; }
@media (min-width: 640px) { .modal-bg { align-items: center; } }
.modal { background: var(--card); width: 100%; max-width: 560px; max-height: 92vh; overflow-y: auto; border-radius: 18px 18px 0 0; padding: 20px; padding-bottom: calc(20px + env(safe-area-inset-bottom, 0px)); }
@media (min-width: 640px) { .modal { border-radius: 18px; } }
.modal h2 { margin: 0 0 16px; font-size: 18px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(80px + env(safe-area-inset-bottom, 0px)); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 10px; z-index: 50; font-size: 13px; box-shadow: 0 8px 30px rgba(0,0,0,.2); }
@media (min-width: 1024px) { .toast { bottom: 24px; } }
.doc-wrap { overflow-x: auto; }
.doc { background: var(--doc-bg); color: var(--doc-fg); border: 1px solid var(--border); border-radius: 16px; padding: 32px; max-width: 800px; margin: 0 auto; font-size: 13px; min-width: 0; }
.doc .dm { color: var(--doc-muted); }
.doc table { width: 100%; border-collapse: collapse; margin-top: 20px; }
.doc th { text-align: left; font-size: 11px; font-weight: 500; color: var(--doc-muted); border-bottom: 1px solid var(--doc-line); padding: 8px 6px 8px 0; }
.doc td { border-bottom: 1px solid var(--doc-line); padding: 8px 6px 8px 0; vertical-align: top; }
.doc .r { text-align: right; }
.doc-head { display: flex; justify-content: space-between; gap: 20px; flex-wrap: wrap; }
.doc-meta { display: grid; grid-template-columns: auto auto; gap: 2px 14px; font-size: 12px; text-align: right; align-self: end; }
@media (max-width: 640px) { .doc { padding: 18px; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
.fade { animation: fade .18s ease-out both; }
@keyframes fade { from { opacity: .4; transform: translateY(3px); } to { opacity: 1; transform: none; } }

.cal-grid { display: grid; grid-template-columns: 46px repeat(7, minmax(0,1fr)); position: relative; }
.cal-h { text-align: center; padding: 8px 2px; font-weight: 500; }
.cal-h small { display: block; font-size: 11px; text-transform: uppercase; color: var(--muted-fg); font-weight: 400; }
.cal-h.today { color: var(--accent); }
.cal-hours { position: relative; }
.cal-hours span { position: absolute; right: 6px; transform: translateY(-50%); font-size: 11px; color: var(--muted-fg); font-variant-numeric: tabular-nums; }
.cal-col { position: relative; border-left: 1px solid var(--border); }
.cal-col.today { background: color-mix(in srgb, var(--accent-soft) 25%, transparent); }

// ---------- Preislogik (Port von src/lib/pricing.ts) ----------
const c = (eur) => Math.round(eur * 100), e = (ct) => Math.round(ct) / 100;
function priceService(s, inp) {
  const base = s.pricing_type === "hourly" ? c(((s.hourly_rate ?? CFG.hourlyRate) * s.duration_minutes) / 60) : c(s.base_price);
  let cls = 0, cf = 1;
  if (s.applies_vehicle_class) { cf = CFG.vehicleClassFactors[inp.vehicleClass] ?? 1; cls = Math.round(base * (cf - 1)); }
  let soil = 0, sf = 1;
  if (s.applies_soiling) { sf = CFG.soilingFactors[inp.soiling] ?? 1; soil = Math.round((base + cls) * (sf - 1)); }
  return { cents: Math.max(0, base + cls + soil), minutes: Math.round(s.duration_minutes * cf * sf), material: c(s.material_cost), breakdown: { base: e(base), cls: e(cls), soil: e(soil) } };
}
function calculate(inp) {
  const svc = new Map(S.services.map((s) => [s.id, s])), pk = new Map(S.packages.map((p) => [p.id, p]));
  const covered = new Set(), lines = [], warnings = [];
  for (const pid of [...new Set(inp.packageIds)]) {
    const p = pk.get(pid); if (!p) continue;
    const mem = p.service_ids.map((id) => svc.get(id)).filter(Boolean);
    const fresh = mem.filter((s) => !covered.has(s.id));
    if (mem.length - fresh.length > 0) warnings.push(`„${p.name}“: ${mem.length - fresh.length} Leistung(en) stecken schon in einem anderen Paket und werden nicht doppelt berechnet.`);
    let sum = 0, min = 0, mat = 0;
    for (const s of fresh) { const r = priceService(s, inp); sum += r.cents; min += r.minutes; mat += r.material; covered.add(s.id); }
    const ct = Math.round(sum * (1 - p.discount_percent / 100));
    lines.push({ kind: "package", title: `Paket: ${p.name}`, includes: fresh.map((s) => s.name), totalNet: e(ct), taxRate: 19, minutes: min, material: e(mat) });
  }
  for (const sid of [...new Set(inp.serviceIds)]) {
    const s = svc.get(sid); if (!s) continue;
    if (covered.has(sid)) { warnings.push(`„${s.name}“ ist schon im Paket enthalten.`); continue; }
    covered.add(sid);
    const r = priceService(s, inp);
    if (r.cents === 0) warnings.push(`Für „${s.name}“ ist noch kein Preis hinterlegt.`);
    lines.push({ kind: "service", serviceId: s.id, title: s.name, totalNet: e(r.cents), taxRate: 19, minutes: r.minutes, material: e(r.material), breakdown: r.breakdown });
  }
  const eff = Math.max(0, Math.round(inp.effort || 0));
  if (eff > 0) lines.push({ kind: "effort", title: `Sonderaufwand (${fmtMin(eff)})`, totalNet: e(c((CFG.hourlyRate * eff) / 60)), taxRate: 19, minutes: eff, material: 0 });
  for (const x of inp.extras || []) if (x.title.trim()) lines.push({ kind: "extra", title: x.title.trim(), totalNet: e(c(x.priceNet || 0)), taxRate: 19, minutes: 0, material: 0 });
  const sub = lines.reduce((a, l) => a + c(l.totalNet), 0);
  let disc = Math.min(100, Math.max(0, inp.discount || 0));
  let net = Math.round(sub * (1 - disc / 100)), manual = false;
  if (inp.override !== null && inp.override !== "" && Number.isFinite(+inp.override) && +inp.override >= 0) { net = c(+inp.override); manual = true; disc = sub ? Math.round((1 - net / sub) * 10000) / 100 : 0; }
  const tax = Math.round(net * 0.19);
  const minutes = lines.reduce((a, l) => a + l.minutes, 0), mat = lines.reduce((a, l) => a + c(l.material), 0), labor = c((CFG.internalHourlyCost * minutes) / 60);
  return { lines, subtotal: e(sub), discount: disc, discountAmount: e(sub - net), net: e(net), tax: e(tax), gross: e(net + tax), minutes, material: e(mat), labor: e(labor), profit: e(net - mat - labor), margin: net ? Math.round(((net - mat - labor) / net) * 1000) / 10 : 0, manual, warnings };
}

function viewOrders() {
  const active = S.orders.filter((o) => !["abgeschlossen", "storniert"].includes(o.status));
  const card = (o) => `<a class="kcard" href="#auftrag--${o.id}"><b>${esc(vname(veh(o.vehicle_id)))}</b><span class="small muted">${esc(cust(o.customer_id).name)}</span><p>${esc(o.title)}</p><div class="kv"><span>${o.start ? fmtDate(o.start, { weekday: "short", hour: "2-digit", minute: "2-digit" }) : o.number}</span><span class="tnum">${o.gross ? eur(o.gross) : "–"}</span></div></a>`;
  const board = `<div class="board">${BOARD.map((s) => { const col = active.filter((o) => o.status === s || (s === "anfrage" && o.status === "angebot_erstellt")); return `<div class="col"><header><span>${OSL[s]}</span><span class="muted">${col.length}</span></header><div class="lane">${col.map(card).join("")}</div></div>`; }).join("")}</div>`;
  const all = [...S.orders].sort((a, b) => (b.start || "").localeCompare(a.start || ""));
  const list = `<div class="card list">${all.map((o) => `<a href="#auftrag--${o.id}"><div class="t"><b>${esc(vname(veh(o.vehicle_id)))} · <span style="display:inline;font-weight:400" class="muted">${esc(cust(o.customer_id).name)}</span></b><span>${o.number} · ${esc(o.title)}${o.start ? " · " + fmtDate(o.start, { dateStyle: "medium", timeStyle: "short" }) : ""}</span></div><div class="row"><span class="tnum">${eur(o.gross)}</span>${obadge(o.status)}</div></a>`).join("")}</div>`;

}

function viewCalc() {
  if (!UI.calc) UI.calc = newCalc({ target: UI.calcTarget });
  const k = UI.calc, r = calculate(k);
  const cv = S.vehicles.filter((v) => !k.customer_id || v.customer_id === k.customer_id);
  const covered = new Set(k.packageIds.flatMap((id) => S.packages.find((p) => p.id === id)?.service_ids || []));
  const term = UI.svcSearch.trim().toLowerCase();
  const groups = new Map();
  for (const s of S.services) if (s.active && (!term || s.name.toLowerCase().includes(term))) groups.set(s.category, [...(groups.get(s.category) || []), s]);
  const acc = [...groups.entries()].map(([cat, list]) => {
    const open = !!term || UI.openCat === cat, n = list.filter((s) => k.serviceIds.includes(s.id)).length;
    return `<div class="acc"><button data-a="openCat" data-cat="${esc(cat)}"><span>${esc(cat)}</span><span class="row">${n ? `<span class="count">${n}</span>` : ""}<span class="muted">${open ? "▴" : "▾"}</span></span></button>${open ? `<div class="body">${list.map((s) => { const inP = covered.has(s.id); return `<label class="chk ${inP ? "dis" : ""}"><span><input type="checkbox" data-a="svc" data-id="${s.id}" ${k.serviceIds.includes(s.id) || inP ? "checked" : ""} ${inP ? "disabled" : ""}>${esc(s.name)}</span><span class="small muted tnum">${inP ? "im Paket" : eur(s.base_price)}</span></label>`; }).join("")}</div>` : ""}</div>`;
  }).join("");
  return `<div class="ph"><div><h1>${k.target === "order" ? "Neuer Auftrag" : "Neues Angebot"}</h1><p>Wähle Fahrzeug und Leistungen – der Preis wird sofort nach deinen Preisregeln berechnet.</p></div></div>
  <div class="side-layout">
    <div class="steps">
      <div class="card pad step"><h2><i>1</i>Kunde & Fahrzeug</h2><div class="fgrid">
        <div class="field"><label for="k-c">Kunde</label><select class="inp" id="k-c" data-k="customer"><option value="">Kunde auswählen …</option>${S.customers.map((x) => `<option value="${x.id}" ${x.id === k.customer_id ? "selected" : ""}>${esc(x.name)}</option>`).join("")}</select></div>
        <div class="field"><label for="k-v">Fahrzeug</label><select class="inp" id="k-v" data-k="vehicle"><option value="">${cv.length ? "Fahrzeug auswählen …" : "– ohne Fahrzeug –"}</option>${cv.map((v) => `<option value="${v.id}" ${v.id === k.vehicle_id ? "selected" : ""}>${esc(vname(v))} (${esc(v.plate)})</option>`).join("")}</select></div>
      </div><p class="small" style="margin:8px 0 0"><button class="btn ghost sm" style="color:var(--accent);padding:0" data-a="newCustomer">+ Neuer Kunde</button></p></div>
      <div class="card pad step"><h2><i>2</i>Fahrzeuggröße & Verschmutzung</h2><div class="fgrid">
        <div class="field"><label for="k-vc">Fahrzeugklasse</label><select class="inp" id="k-vc" data-k="vc">${VC.map((x) => `<option value="${x}" ${x === k.vehicleClass ? "selected" : ""}>${VCL[x]} (${Math.round(CFG.vehicleClassFactors[x] * 100)} %)</option>`).join("")}</select></div>
        <div class="field"><label>Verschmutzungsgrad</label><div class="seg full">${SOIL.map((s) => `<button class="${k.soiling === s ? "on" : ""}" data-a="soil" data-v="${s}">${SOILL[s]}</button>`).join("")}</div></div>
      </div></div>
      <div class="card pad step"><h2><i>3</i>Pakete</h2><div class="picks">${S.packages.map((p) => `<button class="pick ${k.packageIds.includes(p.id) ? "on" : ""}" data-a="pkg" data-id="${p.id}"><b>${esc(p.name)}</b><span>${p.service_ids.length} Leistungen${p.discount_percent ? ` · ${p.discount_percent} % Paketrabatt` : ""}</span></button>`).join("")}</div></div>
      <div class="card pad step"><h2><i>4</i>Einzelleistungen</h2><div class="search">${ic("search")}<input class="inp" id="k-s" data-k="svcSearch" placeholder="Leistung suchen, z. B. „Tierhaar“ …" value="${esc(UI.svcSearch)}"></div>${acc}</div>
      <div class="card pad step"><h2><i>5</i>Sonderaufwand & Rabatt</h2><div class="fgrid">
        <div class="field"><label for="k-e">Sonderaufwand (Minuten)</label><input class="inp" id="k-e" inputmode="numeric" data-k="effort" value="${k.effort || ""}" placeholder="0"><span class="hint">Wird mit ${eur(CFG.hourlyRate)}/Std. berechnet</span></div>
        <div class="field"><label for="k-d">Rabatt (%)</label><input class="inp" id="k-d" inputmode="decimal" data-k="discount" value="${k.discount || ""}" placeholder="0"></div>
        <div class="field"><label for="k-o">Endpreis manuell (€ netto)</label><input class="inp" id="k-o" inputmode="decimal" data-k="override" value="${k.override ?? ""}" placeholder="automatisch"><span class="hint">Überschreibt die Berechnung</span></div>
        <div class="field"><label>Was möchtest du erstellen?</label><div class="seg"><button class="${k.target === "quote" ? "on" : ""}" data-a="target" data-v="quote">Angebot</button><button class="${k.target === "order" ? "on" : ""}" data-a="target" data-v="order">Direkt Auftrag</button></div></div>
      </div></div>
    </div>
    <div class="card sum" id="sum">${sumPanel(k, r)}</div>
  </div>`;
}
function sumPanel(k, r) {
  return `<div class="ch"><div><h2>Zusammenfassung</h2><p>${VCL[k.vehicleClass]} · Verschmutzung ${SOILL[k.soiling].toLowerCase()}</p></div></div>
  ${r.lines.length ? `<ul>${r.lines.map((l) => `<li><div class="kv"><span>${esc(l.title)}</span><span class="tnum">${eur(l.totalNet)}</span></div>${l.breakdown && (l.breakdown.cls || l.breakdown.soil) ? `<div class="small muted">Basis ${eur(l.breakdown.base)}${l.breakdown.cls ? ` · Größe ${l.breakdown.cls > 0 ? "+" : ""}${eur(l.breakdown.cls)}` : ""}${l.breakdown.soil ? ` · Verschm. ${l.breakdown.soil > 0 ? "+" : ""}${eur(l.breakdown.soil)}` : ""}</div>` : ""}${l.includes ? `<div class="small muted">${esc(l.includes.join(", "))}</div>` : ""}</li>`).join("")}</ul>` : `<p class="empty" style="text-align:center">Wähle Pakete oder Leistungen aus – der Preis erscheint sofort.</p>`}
  <div class="tot"><div class="kv"><span>Zwischensumme netto</span><span class="tnum">${eur(r.subtotal)}</span></div>${r.discountAmount ? `<div class="kv"><span>${r.manual ? "Manuelle Anpassung" : `Rabatt ${r.discount} %`}</span><span class="tnum">−${eur(r.discountAmount)}</span></div>` : ""}<div class="kv"><span>USt. 19 %</span><span class="tnum">${eur(r.tax)}</span></div><div class="kv big"><span>Gesamt</span><span class="tnum">${eur(r.gross)}</span></div></div>
  <div class="intern"><b style="color:var(--fg)">Intern (nicht im Angebot)</b><div class="kv"><span>Geschätzte Dauer</span><span>${fmtMin(r.minutes)}</span></div><div class="kv"><span>Materialkosten</span><span class="tnum">${eur(r.material)}</span></div><div class="kv"><span>Arbeitskosten</span><span class="tnum">${eur(r.labor)}</span></div><div class="kv"><span>Geschätzter Gewinn</span><span class="tnum">${eur(r.profit)} (${r.margin} %)</span></div></div>
  ${r.warnings.length ? `<div class="warn">${r.warnings.map((w) => `<span>⚠ ${esc(w)}</span>`).join("")}</div>` : ""}
  <div class="pad" style="border-top:1px solid var(--border)"><button class="btn block" data-a="saveCalc" ${!k.customer_id || !r.lines.length ? "disabled style=\"opacity:.45\"" : ""}>${k.target === "order" ? "Auftrag anlegen" : "Angebot erstellen"}</button>${!k.customer_id ? '<p class="small muted" style="text-align:center;margin:8px 0 0">Bitte zuerst einen Kunden auswählen.</p>' : ""}</div>`;
}

function lanes(items) {
  const sorted = [...items].sort((a, b) => a.start - b.start || b.end - a.end), out = [];
  let group = [], ends = [], gEnd = -Infinity;
  const flush = () => { group.forEach((g) => (g.n = ends.length)); out.push(...group); group = []; ends = []; };
  for (const it of sorted) {
    if (it.start >= gEnd && group.length) flush();
    let lane = ends.findIndex((e) => e <= it.start);
    if (lane === -1) { lane = ends.length; ends.push(it.end); } else ends[lane] = it.end;
    group.push({ ...it, lane, n: 1 }); gEnd = group.length === 1 ? it.end : Math.max(gEnd, it.end);
  }
  if (group.length) flush();
  return out;
}

    case "orderNext": { const o = S.orders.find((x) => x.id === el.dataset.id); setOrderStatus(o, NEXT[o.status]); break; }
    case "orderSet": { const o = S.orders.find((x) => x.id === el.dataset.id); setOrderStatus(o, document.getElementById("ostatus").value); break; }
    case "toggleItem": { const o = S.orders.find((x) => x.id === el.dataset.id); const it = o.items.find((i) => i.id === el.dataset.item); it.done = !it.done; save(); render(); break; }
    case "quoteStatus": { const q = S.quotes.find((x) => x.id === el.dataset.id); q.status = el.dataset.to; save(); toast(`Angebot: ${QSL[q.status]}`); break; }
    case "convert": {
      const q = S.quotes.find((x) => x.id === el.dataset.id), r = quoteCalc(q);
      const o = { id: uid(), quote_id: q.id, number: `AU-2026-${String(++S.counters.order).padStart(4, "0")}`, customer_id: q.customer_id, vehicle_id: q.vehicle_id, status: "bestaetigt", title: r.lines.slice(0, 2).map((l) => l.title.replace("Paket: ", "")).join(", "), start: null, net: r.net, gross: r.gross, items: r.lines.map((l) => ({ id: uid(), title: l.title, net: l.totalNet, done: false })), history: [{ s: "bestaetigt", at: new Date().toISOString() }], notes: "" };
      S.orders.push(o); save(); go("auftrag", o.id); break;
    }
    case "openCat": UI.openCat = UI.openCat === el.dataset.cat ? null : el.dataset.cat; render(); break;
    case "soil": k.soiling = el.dataset.v; render(); break;
    case "pkg": k.packageIds = k.packageIds.includes(el.dataset.id) ? k.packageIds.filter((x) => x !== el.dataset.id) : [...k.packageIds, el.dataset.id]; render(); break;
    case "target": k.target = el.dataset.v; render(); break;
    case "saveCalc": {
      const r = calculate(k); if (!k.customer_id || !r.lines.length) return;
      if (k.target === "order") {
        const o = { id: uid(), number: `AU-2026-${String(++S.counters.order).padStart(4, "0")}`, customer_id: k.customer_id, vehicle_id: k.vehicle_id, status: "bestaetigt", title: r.lines.slice(0, 2).map((l) => l.title.replace("Paket: ", "")).join(", "), start: null, net: r.net, gross: r.gross, items: r.lines.map((l) => ({ id: uid(), title: l.title, net: l.totalNet, done: false })), history: [{ s: "bestaetigt", at: new Date().toISOString() }], notes: "" };
        S.orders.push(o); UI.calc = null; save(); go("auftrag", o.id);
      } else {
        const q = { id: uid(), number: `AN-2026-${String(++S.counters.quote).padStart(4, "0")}`, customer_id: k.customer_id, vehicle_id: k.vehicle_id, status: "draft", created: new Date().toISOString(), calc: { vehicleClass: k.vehicleClass, soiling: k.soiling, serviceIds: [...k.serviceIds], packageIds: [...k.packageIds], effort: k.effort, extras: [], discount: k.discount, override: k.override }, intro: "" };
        S.quotes.push(q); UI.calc = null; save(); go("angebot", q.id);
      }
      break;
    }
    case "toggleSvc": { const s = S.services.find((x) => x.id === el.dataset.id); s.active = !s.active; save(); render(); break; }
    case "newCustomer": UI.modal = { type: "customer", ctype: "private" }; render(); setTimeout(() => document.getElementById("m-name")?.focus(), 0); break;
    case "newVehicle": UI.modal = { type: "vehicle", cust: el.dataset.cust || (UI.calc?.customer_id) || S.customers[0].id }; render(); break;
    case "ctype": { const name = document.getElementById("m-name")?.value; UI.modal.ctype = el.dataset.v; render(); document.getElementById("m-name").value = name || ""; break; }
    case "closeModal": UI.modal = null; render(); break;
  }
});
app.addEventListener("change", (ev) => {
  const el = ev.target;
  if (el.dataset.a === "svc") { const k = UI.calc, id = el.dataset.id; k.serviceIds = el.checked ? [...k.serviceIds, id] : k.serviceIds.filter((x) => x !== id); render(); return; }
  if (el.dataset.k === "customer") { UI.calc.customer_id = el.value; UI.calc.vehicle_id = ""; render(); return; }
  if (el.dataset.k === "vehicle") { const v = veh(el.value); UI.calc.vehicle_id = el.value; if (v) { UI.calc.vehicleClass = v.vc; UI.calc.customer_id = v.customer_id; } render(); return; }
  if (el.dataset.k === "vc") { UI.calc.vehicleClass = el.value; render(); return; }
  if (el.dataset.price) { const s = S.services.find((x) => x.id === el.dataset.price); const n = Number(String(el.value).replace(",", ".")); if (Number.isFinite(n) && n >= 0) { s.base_price = n; save(); toast(`${s.name}: ${eur(n)}`); } else { el.value = String(s.base_price).replace(".", ","); } }
});
app.addEventListener("input", (ev) => {
  const el = ev.target, k = el.dataset.k;
  if (k === "svcSearch") { UI.svcSearch = el.value; render(); }
  else if (k === "custSearch") { UI.custSearch = el.value; render(); }
  else if (k === "vehSearch") { UI.vehSearch = el.value; render(); }
  else if (k === "effort") { UI.calc.effort = Math.max(0, parseInt(el.value) || 0); refreshSum(); }
  else if (k === "discount") { UI.calc.discount = Math.min(100, Math.max(0, Number(el.value.replace(",", ".")) || 0)); refreshSum(); }
  else if (k === "override") { UI.calc.override = el.value.trim() === "" ? null : Number(el.value.replace(",", ".")); refreshSum(); }
  else if (el.id === "onotes") { const o = S.orders.find((x) => x.id === el.dataset.id); o.notes = el.value; save(); }
});
app.addEventListener("submit", (ev) => {
  ev.preventDefault();
  const f = ev.target, val = (id) => document.getElementById(id)?.value.trim() || "";
  if (f.dataset.m === "customer") {
    const name = val("m-name"); if (!name) return;
    const x = { id: uid(), type: UI.modal.ctype, name, phone: val("m-phone"), email: val("m-email"), street: val("m-street"), city: val("m-city"), notes: "" };
    S.customers.push(x); UI.modal = null; save();
    if (UI.calc && location.hash === "#kalkulator") { UI.calc.customer_id = x.id; UI.calc.vehicle_id = ""; toast("Kunde angelegt"); } else go("kunde", x.id);
  } else {
    const make = val("m-make"), model = val("m-model"); if (!make || !model) return;
    const v = { id: uid(), customer_id: val("m-cust"), make, model, plate: val("m-plate") || "–", vc: val("m-vc"), color: val("m-color"), year: parseInt(val("m-year")) || null, damages: "" };
    S.vehicles.push(v); UI.modal = null; save();
    if (UI.calc && location.hash === "#kalkulator") { UI.calc.customer_id = v.customer_id; UI.calc.vehicle_id = v.id; UI.calc.vehicleClass = v.vc; toast("Fahrzeug angelegt"); } else go("fahrzeug", v.id);
  }
});
window.addEventListener("hashchange", () => { UI.menu = false; if (route().view !== "kalkulator") {} render(); window.scrollTo(0, 0); });
render();
</script>
