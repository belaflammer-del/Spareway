# Render Blueprint – Testbetrieb von DEAL-NIVO (Demo-/Lokalmodus, ohne API-Schlüssel)
# Daten liegen im Container und werden bei jedem Neustart/Deploy zurückgesetzt.
services:
  - type: web
    name: dealnivo
    runtime: node
    plan: free
    rootDir: kaufpruefer
    buildCommand: npm ci && npm run build
    startCommand: npm start -- -p $PORT
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: APP_SECRET
        generateValue: true
      - key: ALLOW_TEST_CREDITS
        value: "true"
      - key: ADMIN_EMAILS
        sync: false
      # V4 (optional): Hintergrundjobs, Benachrichtigungen
      - key: CRON_SECRET
        generateValue: true
      - key: JOB_WORKER
        value: "on"
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
